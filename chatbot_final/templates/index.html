<!DOCTYPE html>
<html>
<head>
<title>Skyline Chatbot</title>
<style>
body{
margin:0;
font-family:Arial;
display:flex;
height:100vh;
background:#f5f5f5;
}
.sidebar{
width:220px;
background:white;
padding:20px;
box-shadow:2px 0 10px rgba(0,0,0,0.1);
}
.sidebar button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
background:#eee;
font-size:20px;
cursor:pointer;
}
.main{
flex:1;
padding:30px;
background:linear-gradient(to right,#0d2fa8,#1d4fff);
color:white;
}
.box{
background:white;
color:black;
padding:25px;
border-radius:20px;
min-height:300px;
font-size:22px;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>Skyline University</h2>

<button onclick="showHome()">🏠 Home</button>
<button onclick="showChat()">💬 Chatbot</button>
<button onclick="showCourses()">📘 Courses</button>
<button onclick="showAdmission()">📌 Admission</button>
<button onclick="showContact()">📞 Contact</button>
</div>

<div class="main">
<h1>AI Chatbot</h1>
<div class="box" id="content">
Welcome to Skyline University Kano.
</div>
</div>

<script>
function showHome(){
document.getElementById("content").innerHTML =
"Welcome to Skyline University Kano.";
}

function showCourses(){
document.getElementById("content").innerHTML =
"Courses Available:<br><br>Computer Science<br>Accounting<br>Business Administration<br>Cyber Security";
}

function showAdmission(){
document.getElementById("content").innerHTML =
"Admission forms are available online. Visit the school portal.";
}

function showContact(){
document.getElementById("content").innerHTML =
"Email: info@sun.edu.ng<br><br>Phone: +234 XXX XXX XXXX<br><br>Website: www.sun.edu.ng";
}

function showChat(){
document.getElementById("content").innerHTML =
"Use the chatbot message box below to ask questions.";
}
</script>
<div style="position:fixed; bottom:20px; right:20px; left:320px;">
    <input type="text" id="userInput"
    placeholder="Type message here..."
    style="width:75%; padding:15px; border-radius:10px; border:none; font-size:18px;">

    <button onclick="sendMessage()"
    style="padding:15px 25px; background:orange; color:white; border:none; border-radius:10px; font-size:18px;">
    Send
    </button>

    <div id="chatResponse"
    style="background:white; color:black; margin-top:15px; padding:15px; border-radius:10px;">
    </div>
</div>

<script>
function sendMessage(){
    let userText = document.getElementById("userInput").value;

    fetch("/get?msg=" + userText)
    .then(response => response.text())
    .then(data => {
        document.getElementById("chatResponse").innerHTML =
        "<b>You:</b> " + userText + "<br><br><b>Bot:</b> " + data;
    });
}
</script>
</body>
</html>
